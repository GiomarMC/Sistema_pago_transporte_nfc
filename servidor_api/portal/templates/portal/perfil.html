{% extends 'portal/base.html' %}{% block contenido %}<div class="pagina-cabecera"><h1>Mi perfil</h1><p>Datos y preferencias de tu cuenta.</p></div><div class="grid grid-dos"><section class="tarjeta"><h2>Datos personales</h2><dl><dt>Nombre</dt><dd id="nombre">Cargando…</dd><dt>DNI</dt><dd id="dni">…</dd><dt>Correo</dt><dd id="correo">…</dd></dl><form id="form-correo" class="formulario"><div class="campo"><label for="nuevo-correo">Nuevo correo</label><input id="nuevo-correo" type="email" autocomplete="email" required></div><button class="boton secundario">Solicitar cambio</button></form><form id="form-otp" class="formulario" hidden><p>Ingresa el código enviado al nuevo correo (prueba: 123456).</p><div class="campo"><label for="otp">Código</label><input id="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required></div><button class="boton primario">Confirmar correo</button></form></section><section class="tarjeta"><h2>Más opciones</h2><div class="formulario"><a class="boton secundario" href="{{ portal_base }}seguridad/" data-nav>Seguridad y dispositivos</a><a class="boton secundario" href="{{ portal_base }}tarjeta/" data-nav>Mi tarjeta</a><button id="salir" class="boton secundario">Cerrar sesión</button></div></section></div><div id="error" class="alerta error" role="alert" hidden></div>{% endblock %}
