; Pantalla del validador: ESP32 (WROOM-32) + LCD SSD1283A 130x130 por SPI.
;   Programa del validador:    pio run -e esp32dev -t upload
;   Prueba de componentes:     pio run -e prueba -t upload
;   Ver mensajes de la placa:  pio device monitor

[env]
; Plataforma oficial con el núcleo Arduino-ESP32 2.x (descarga más ligera).
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Velocidad de carga conservadora: algunos cables y chips USB fallan a 460800
upload_speed = 115200
lib_deps =
    ; Última versión de la biblioteca compatible con el núcleo 2.x
    moononournation/GFX Library for Arduino@1.4.9

[env:esp32dev]
build_src_filter = +<main.cpp>

[env:prueba]
build_src_filter = +<prueba_componentes.cpp>

[env:validador]
; Validador completo en la ESP32. Por ahora el ACR122U sigue en el ordenador,
; que solo hace de puente (transporte/puente_nfc.py).
build_src_filter = +<validador/>
lib_deps =
    ${env.lib_deps}
    ; JSON de la sincronización con el servidor
    bblanchon/ArduinoJson@^7.2.0
test_speed = 115200
