{% extends 'portal/base.html' %}{% block contenido %}<div class="pagina-cabecera"><h1>Seguridad</h1><p>Protege el acceso a tu cuenta.</p></div><div class="grid grid-dos"><section class="tarjeta"><h2>Cambiar contraseña</h2><form id="form-clave" class="formulario"><div class="campo"><label for="actual">Contraseña actual</label><input id="actual" type="password" autocomplete="current-password" required></div><div class="campo"><label for="nueva">Nueva contraseña</label><input id="nueva" type="password" autocomplete="new-password" required><span class="ayuda">10 caracteres, mayúscula, minúscula y número.</span></div><button class="boton primario">Guardar contraseña</button></form></section><section class="tarjeta"><h2>Dispositivos de confianza</h2><ul id="dispositivos" class="lista"><li>Cargando…</li></ul><button id="salir" class="boton secundario">Cerrar sesión</button></section></div><section class="tarjeta" style="margin-top:16px"><h2>Accesos recientes</h2><ul id="accesos" class="lista"><li>Cargando…</li></ul></section><div id="error" class="alerta error" role="alert" hidden></div>{% endblock %}
