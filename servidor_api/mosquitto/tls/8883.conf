# Listener público con TLS (solo producción). El certificado es el de Let's
# Encrypt que obtiene Caddy; certificado.sh lo copia a /mosquitto/data/tls para
# que lo pueda leer el usuario mosquitto (Caddy lo deja legible solo por root).
listener 8883
certfile /mosquitto/data/tls/servidor.crt
keyfile /mosquitto/data/tls/servidor.key
tls_version tlsv1.2
