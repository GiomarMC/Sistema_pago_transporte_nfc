# Broker MQTT de la sincronización v2 (M9-05, contrato C1 5.8).
#
# Este directorio se monta en /mosquitto/config (solo lectura). El password_file
# no está en git: lo arma mosquitto/credenciales.sh desde la base de datos y vive
# en el volumen /mosquitto/data junto con la copia del certificado TLS.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# QoS 0 y sin sesiones persistentes (C1): nada que guardar en disco
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Sin TLS, solo dentro de la red de Docker (para el puente). No se publica.
listener 1883

# En producción se monta aquí tls/ con el listener 8883 (docker-compose.prod.yml)
include_dir /mosquitto/config/conf.d
