; Pantalla del validador: ESP32 (WROOM-32) + LCD SSD1283A 130x130 por SPI, o bien
; OLED de 1,3" 128x64 por I2C (los entornos *_oled).
;   Programa del validador (LCD):   pio run -e validador -t upload
;   Programa del validador (OLED):  pio run -e validador_oled -t upload
;   Prueba de la LCD y la microSD:  pio run -e prueba -t upload
;   Prueba de la OLED:              pio run -e prueba_oled -t upload
;   Prueba de ESP-NOW (2 placas):   pio run -e prueba_espnow -t upload
;   Ver mensajes de la placa:      pio device monitor
; Si la imagen de la OLED sale corrida 2 píxeles o con ruido en un borde, el módulo
; lleva un SSD1306 en vez de un SH1106: usa los entornos *_oled_ssd1306.

[env]
; Plataforma oficial con el núcleo Arduino-ESP32 2.x (descarga más ligera).
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
; "chain+" respeta los #ifdef al buscar bibliotecas: así la LCD y la OLED no se
; arrastran mutuamente (cada entorno solo compila la pantalla que usa).
lib_ldf_mode = chain+
monitor_speed = 115200
; Velocidad de carga conservadora: algunos cables y chips USB fallan a 460800
upload_speed = 115200
lib_deps =
    ; Última versión de la biblioteca compatible con el núcleo 2.x
    moononournation/GFX Library for Arduino@1.4.9

[env:esp32dev]
build_src_filter = +<main.cpp>

[env:prueba]
build_src_filter = +<prueba_componentes.cpp>

[env:prueba_espnow]
; Prueba de ESP-NOW entre buses (M8-01): balizas y tabla de vecinos. Sin pantalla ni WiFi
build_src_filter = +<prueba_espnow.cpp>
lib_deps =
    ${env.lib_deps}
    ; CanalMqtt (de la misma biblioteca Enlaces) lo necesita para compilar
    knolleary/PubSubClient@^2.8

[env:prueba_almacen]
; Prueba del almacenamiento binario (M3-01/02) sobre la microSD real
build_src_filter = +<prueba_almacen.cpp>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8

[env:validador]
; Validador completo en la ESP32 con el lector PN532 (I2C). El ordenador solo
; hace falta para configurarlo (transporte/puente_nfc.py --configurar).
build_src_filter = +<validador/>
lib_deps =
    ${env.lib_deps}
    ; JSON de la sincronización con el servidor
    bblanchon/ArduinoJson@^7.2.0
    ; MQTT C2 sobre EnlaceWifi
    knolleary/PubSubClient@^2.8
test_speed = 115200

; --- Versión con OLED de 1,3" (I2C, SDA = P21, SCL = P22) en lugar de la LCD -----
; Misma lógica de cobro y la misma ESP32; solo cambia la pantalla.

[oled]
build_flags = -DPANTALLA_OLED
lib_deps =
    olikraus/U8g2@^2.36.5

[oled_ssd1306]
; Módulos cuyo controlador es SSD1306 (los de SH1106 usan [oled])
build_flags = -DPANTALLA_OLED -DOLED_SSD1306
lib_deps = ${oled.lib_deps}

[env:validador_oled]
build_src_filter = +<validador/>
build_flags = ${oled.build_flags}
lib_deps =
    ${oled.lib_deps}
    bblanchon/ArduinoJson@^7.2.0
    ; MQTT C2 (lo usa gestor_enlaces, igual que el entorno validador)
    knolleary/PubSubClient@^2.8

[env:validador_oled_ssd1306]
build_src_filter = +<validador/>
build_flags = ${oled_ssd1306.build_flags}
lib_deps =
    ${oled_ssd1306.lib_deps}
    bblanchon/ArduinoJson@^7.2.0
    ; MQTT C2 (lo usa gestor_enlaces, igual que el entorno validador)
    knolleary/PubSubClient@^2.8

[env:prueba_oled]
; Escanea el bus I2C y recorre todas las pantallas en la OLED
build_src_filter = +<prueba_oled.cpp>
build_flags = ${oled.build_flags}
lib_deps = ${oled.lib_deps}

[env:prueba_oled_ssd1306]
build_src_filter = +<prueba_oled.cpp>
build_flags = ${oled_ssd1306.build_flags}
lib_deps = ${oled_ssd1306.lib_deps}
