# CI de los programas de PC (transporte/):
#   - pruebas unitarias con unittest (sin lector NFC ni tarjetas)
#   - las dependencias comunes con servidor_api/ deben fijarse con la misma versión
name: Transporte

on:
  push:
    branches: [main, develop]
    paths:
      - "transporte/**"
      - "docs/contratos/vectores_an10922.json"
      - "servidor_api/requirements.txt"
      - ".github/workflows/transporte.yml"
  pull_request:
    paths:
      - "transporte/**"
      - "docs/contratos/vectores_an10922.json"
      - "servidor_api/requirements.txt"
      - ".github/workflows/transporte.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transporte
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: transporte/requirements.txt
      # pyscard compila contra PC/SC si no hay rueda para la plataforma
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcsclite-dev swig
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -t . -s . -p "test_*.py" -v
